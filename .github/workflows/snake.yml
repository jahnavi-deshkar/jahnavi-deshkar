name: GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # Generate the Snake animation
      - name: Generate Contribution Snake
        uses: Platane/snk@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |

            # Main Snake
            dist/github-snake.svg?color_snake=#50C878&color_dots=#0B1F1A,#123C32,#1F6B57,#2E9B7A,#50C878

            # Dark version
            dist/github-snake-dark.svg?color_snake=#50C878&color_dots=#071512,#0B3028,#145442,#1F8066,#50C878

            # Animated GIF
            dist/github-snake.gif?color_snake=#50C878&color_dots=#0B1F1A,#123C32,#1F6B57,#2E9B7A,#50C878&color_background=#0D1117

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish generated files to output branch
      - name: Deploy Snake Animation
        uses: peaceiris/actions-gh-pages@v4

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake [skip ci]"
